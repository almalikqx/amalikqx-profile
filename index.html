<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Malik — Personal Profile</title>
  <meta name="description" content="Software Engineer & UI Designer. Suka ngopi dan ngoding tengah malam." />
  <meta name="theme-color" content="#C67B4A" />

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Malik — Personal Profile" />
  <meta property="og:description" content="Software Engineer & UI Designer." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop" />
  <meta property="og:url" content="https://malik.github.io" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Panggil CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-scene">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="container">
    <div class="cover-wrap">
      <img id="domCover" class="cover" src="" alt="Cover photo" />
    </div>

    <div class="profile-wrap">
      <div class="profile-ring">
        <img id="domProfile" class="profile" src="" alt="Profile photo" />
      </div>
    </div>

    <div class="info">
      <h1 class="name"><span id="domName"></span></h1>
      <div class="username">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        @<span id="domUsername"></span>
      </div>
      <p class="bio" id="domBio"></p>
    </div>

    <div class="divider">
      <span class="divider-dot"></span>
      <span>Connect</span>
      <span class="divider-dot"></span>
    </div>

    <nav class="socials" id="socialContainer">
      <!-- Links akan di-generate otomatis -->
    </nav>

    <div class="footer">
      <span>Made with <span style="color:var(--accent)">♥</span> · © <span id="currentYear"></span></span>
    </div>
  </main>

  <!-- Panggil JS (config duluan) -->
  <script src="config.js"></script>
  <script src="script.js"></script> 
</body>
</html>
